name: release

on:
  push:
    # Release versions are plain x.y.z (no "v" prefix), matching the MSI version and the
    # archive name. The glob is only a coarse filter; the job re-checks it exactly.
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Guard - tag must be plain x.y.z
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' is not a plain x.y.z version (e.g. 0.3.0, no 'v' prefix)."
            exit 1
          }
          Write-Host "Tag '$tag' is a valid x.y.z version."

      - name: Guard - tag commit must be on main
        id: guard
        shell: pwsh
        run: |
          git fetch origin main --quiet
          $commit = git rev-list -n 1 "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { $commit = "${{ github.sha }}" }
          git merge-base --is-ancestor $commit origin/main
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag commit is on main; release will proceed."
            "on_main=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "Tag commit is NOT on main; release will be skipped."
            "on_main=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Publish metro-osd
        shell: pwsh
        run: |
          dotnet publish MetroOsd.csproj -c Release -f net48 `
            -p:DebugType=none -p:DebugSymbols=false `
            -o publish/osd

      - name: Stage files and create archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist/MetroOsd | Out-Null
          Copy-Item -Path publish/osd/* -Destination dist/MetroOsd -Recurse
          Copy-Item -LiteralPath README.md -Destination dist/MetroOsd/README.md
          Compress-Archive -Path dist/MetroOsd/* -DestinationPath "MetroOsd-$tag.zip" -Force

      - name: Publish GitHub Release
        if: steps.guard.outputs.on_main == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            MetroOsd-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
